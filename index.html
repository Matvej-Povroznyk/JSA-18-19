<!DOCTYPE html><html lang=en><link rel=stylesheet href=/JSA-18-19/JSA-18-19.bb4c60e8.css><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1.0"><title>CRUD Students</title><link rel=stylesheet href=/JSA-18-19/JSA-18-19.7f51d469.css><body>
    <div class=container>
      <h1>Список студентів</h1>
      <button id=get-students-btn>Отримати студентів</button>
      <table id=students-table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Ім'я</th>
            <th>Вік</th>
            <th>Курс</th>
            <th>Навички</th>
            <th>Email</th>
            <th>Статус</th>
            <th>Дії</th>
          </tr>
        </thead>
        <tbody>

        </tbody>
      </table>
      <h2>Додати нового студента</h2>
      <form id=add-student-form>
        <label>Ім'я: <input id=name required name=name></label>
        <label>Вік: <input type=number id=age required name=age></label>
        <label>Курс: <input id=course required name=course></label>
        <label>Навички (через кому): <input id=skills name=skills></label>
        <label>Email: <input type=email id=email required name=email></label>
        <label>Записаний: <input type=checkbox id=isEnrolled name=isEnrolled></label>
        <button>Додати студента</button>
      </form>
    </div>

    <script src=/JSA-18-19/JSA-18-19.ff2447c0.js type=module></script>
